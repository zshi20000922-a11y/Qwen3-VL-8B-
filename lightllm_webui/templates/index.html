<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LightLLM 聊天</title>
<style>
:root{color-scheme:light;--ink:#17211d;--muted:#728078;--line:#e3e9e4;--green:#176b4a;--paper:#f5f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 980px)/2));background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:700;font-size:17px;display:flex;gap:11px;align-items:center}.mark{display:grid;place-items:center;width:34px;height:34px;color:#fff;background:var(--green);border-radius:11px;font-size:18px}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#b7c1ba}.dot.ok{background:#28a36a}.dot.bad{background:#d85c52}
main{width:min(920px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;padding:20px 18px 14px}.welcome{margin:auto;text-align:center;max-width:570px;padding:28px 10px}.welcome h1{font-size:28px;letter-spacing:-.6px;margin:10px 0}.welcome p{color:var(--muted);margin:0}.welcome .mark{margin:auto;width:48px;height:48px;font-size:24px}.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:25px}.suggestions button{background:white;border:1px solid var(--line);border-radius:20px;padding:8px 13px;color:#44514a;cursor:pointer}.suggestions button:hover{border-color:#9bb9a7}
#messages{overflow:auto;flex:1;display:none;padding:8px 2px 18px}.row{display:flex;gap:11px;margin:18px 0;align-items:flex-start}.row.user{flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#e5eee8;color:var(--green);display:grid;place-items:center;font-size:13px;font-weight:700}.user .avatar{background:#dfe6f2;color:#425d85}.bubble{max-width:min(76%,680px);padding:12px 15px;border:1px solid var(--line);border-radius:15px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#eaf2ed;border-color:#dce8df}.bubble img{display:block;max-width:min(320px,100%);max-height:240px;border-radius:9px;margin-bottom:9px}.error{color:#a33730}.composer{background:white;border:1px solid #dce4dd;border-radius:18px;box-shadow:0 8px 30px #1835230b;padding:11px 13px 9px}.preview{display:none;align-items:center;gap:8px;padding:0 5px 8px;color:var(--muted);font-size:12px}.preview img{height:48px;width:48px;object-fit:cover;border-radius:7px}.preview button{border:0;background:#eef1ee;border-radius:50%;width:24px;height:24px;cursor:pointer}.inputrow{display:flex;align-items:flex-end;gap:8px}.inputrow textarea{flex:1;resize:none;max-height:180px;min-height:44px;border:0;outline:0;font:inherit;padding:10px 7px;color:var(--ink)}.iconbtn,.send{height:40px;min-width:40px;border:0;border-radius:12px;cursor:pointer}.iconbtn{background:transparent;color:#66766c;font-size:19px}.iconbtn:hover{background:#f0f4f0}.send{background:var(--green);color:white;font-size:18px}.send:disabled{opacity:.45;cursor:default}.hint{display:flex;justify-content:space-between;padding:4px 5px 0;color:#98a29b;font-size:11px}.settings{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.settings label{display:flex;align-items:center;gap:5px}.settings input{width:55px;border:1px solid var(--line);border-radius:7px;padding:4px;color:var(--ink)}footer{text-align:center;color:#9aa49d;font-size:11px;padding:0 10px 10px}
@media(max-width:600px){header{padding:0 15px}main{padding:10px 10px}.bubble{max-width:84%}.settings{gap:6px}.hint{font-size:10px}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">✳</div>LightLLM 聊天</div><div class="status"><span class="dot" id="dot"></span><span id="status">正在连接模型…</span></div></header>
<main>
<section class="welcome" id="welcome"><div class="mark">✳</div><h1>有什么可以帮你？</h1><p>连接到本机 Qwen3-VL 模型。你可以提问，也可以上传图片进行识图。</p><div class="suggestions"><button>用简单的话解释注意力机制</button><button>帮我总结这张图片</button><button>写一段 Python 文件读取代码</button></div></section>
<section id="messages" aria-live="polite"></section>
<div class="composer"><div class="preview" id="preview"><img id="previewImg"><span id="previewName"></span><button id="removeImage" title="移除图片">×</button></div><div class="inputrow"><input id="file" type="file" accept="image/*" hidden><button class="iconbtn" id="attach" title="上传图片">＋</button><textarea id="prompt" rows="1" placeholder="给 Qwen 发消息…"></textarea><button class="send" id="send" title="发送">↑</button></div><div class="hint"><div class="settings"><label>温度 <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></label><label>最大回复 <input id="maxTokens" type="number" min="1" max="8192" step="128" value="1024"></label><button class="iconbtn" id="clear" title="新建对话" style="font-size:13px;height:24px">清空对话</button></div><span>Enter 发送 · Shift+Enter 换行</span></div></div>
</main><footer>由本机 LightLLM 提供推理 · 对话仅发送到配置的模型服务</footer>
<script>
const $=id=>document.getElementById(id), history=[];let selectedFile=null,busy=false;
async function checkModel(){try{const r=await fetch('/api/models');if(!r.ok)throw Error();const data=await r.json();const name=data.data?.[0]?.id||'模型在线';$('status').textContent=name;$('dot').className='dot ok'}catch{$('status').textContent='模型服务不可用';$('dot').className='dot bad'}}
checkModel();
function showMessages(){ $('welcome').style.display='none';$('messages').style.display='block' }
function addMessage(role,text,imageUrl=null,extraClass=''){showMessages();const row=document.createElement('div');row.className='row '+(role==='user'?'user':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'我':'Q';const bubble=document.createElement('div');bubble.className='bubble '+extraClass;if(imageUrl){const img=document.createElement('img');img.src=imageUrl;bubble.appendChild(img)}const content=document.createElement('span');content.textContent=text;bubble.appendChild(content);row.append(avatar,bubble);$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight;return {row,content,bubble}}
$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;selectedFile=f;$('previewImg').src=URL.createObjectURL(f);$('previewName').textContent=f.name;$('preview').style.display='flex'};$('removeImage').onclick=()=>{selectedFile=null;$('file').value='';$('preview').style.display='none'};
document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{$('prompt').value=b.textContent;$('prompt').focus()});$('clear').onclick=()=>{history.length=0;$('messages').replaceChildren();$('messages').style.display='none';$('welcome').style.display='block'};
async function send(){if(busy)return;const text=$('prompt').value.trim();if(!text&&!selectedFile)return;busy=true;$('send').disabled=true;const userImage=selectedFile?URL.createObjectURL(selectedFile):null;addMessage('user',text,userImage);let content=text;if(selectedFile){const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(selectedFile)});content=[{type:'text',text:text||'请描述这张图片。'},{type:'image_url',image_url:{url:dataUrl}}]}
history.push({role:'user',content});$('prompt').value='';const file=selectedFile;$('removeImage').click();const answer=addMessage('assistant','');try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,temperature:Number($('temperature').value),max_tokens:Number($('maxTokens').value)})});if(!response.ok){const e=await response.json();throw Error(e.error||'请求失败')}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',full='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split(/\r?\n/);buffer=lines.pop();for(const line of lines){if(!line.startsWith('data:'))continue;const data=line.slice(5).trim();if(data==='[DONE]')continue;try{const obj=JSON.parse(data);const delta=obj.choices?.[0]?.delta?.content;if(delta){full+=typeof delta==='string'?delta:Array.isArray(delta)?delta.map(p=>p.text||'').join(''):'';answer.content.textContent=full;$('messages').scrollTop=$('messages').scrollHeight}}catch{}}}if(!full)answer.content.textContent='（模型没有返回文本）';history.push({role:'assistant',content:full})}catch(e){answer.content.textContent='请求出错：'+e.message;answer.content.classList.add('error');history.pop()}finally{busy=false;$('send').disabled=false;$('prompt').focus()}}
$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('prompt').oninput=()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'};
</script>
</body></html>
